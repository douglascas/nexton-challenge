<div class="status-badge" [ngClass]="status || 'idle'" [attr.aria-live]="'polite'">
  @switch (status) {
    @case ('saving') {
      <div class="indicator">
        <span class="spinner" aria-hidden="true"></span>
        <span class="status-text">Saving...</span>
      </div>
    }
    @case ('saved') {
      <div class="indicator">
        <svg class="icon success-icon" viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
          <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
        </svg>
        <span class="status-text">Saved</span>
      </div>
    }
    @case ('retrying') {
      <div class="indicator">
        <span class="spinner retry-spinner" aria-hidden="true"></span>
        <span class="status-text">Error – retrying...</span>
      </div>
    }
    @case ('error') {
      <div class="indicator">
        <svg class="icon error-icon" viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
        <span class="status-text">Error saving</span>
      </div>
    }
    @default {
      <div class="indicator idle-indicator">
        <span class="dot"></span>
        <span class="status-text">Ready</span>
      </div>
    }
  }
</div>
